<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사원번호 조회</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #fce4ec 0%, #fdf6f9 50%, #f8bbd0 100%);
    min-height: 100vh;
    padding: 40px 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 32px; }
  .header h1 { font-size: 26px; font-weight: 700; color: #ad1457; margin-bottom: 6px; }
  .header p { font-size: 13px; color: #c48b9f; }

  .tabs { display: flex; gap: 8px; }
  .tab-btn {
    flex: 1; padding: 13px; border: none;
    border-radius: 14px 14px 0 0;
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: #f8d7e3; color: #c48b9f; transition: all 0.2s;
  }
  .tab-btn.active { background: white; color: #ad1457; box-shadow: 0 -2px 8px rgba(173,20,87,0.08); }

  .card {
    background: white; border-radius: 0 0 20px 20px;
    padding: 28px 32px;
    box-shadow: 0 4px 24px rgba(173,20,87,0.10);
    margin-bottom: 24px;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .input-wrap { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .input-wrap input {
    flex: 1; border: 2px solid #f48fb1; border-radius: 12px;
    padding: 13px 18px; font-size: 15px; color: #3a1a2e;
    outline: none; background: #fff9fb; transition: border-color 0.2s;
  }
  .input-wrap input:focus { border-color: #e91e8c; background: #fff; }
  .input-wrap input::placeholder { color: #e0a0bc; }

  .bulk-wrap textarea {
    width: 100%; height: 200px;
    border: 2px solid #f48fb1; border-radius: 12px;
    padding: 14px 18px; font-size: 13px;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', monospace;
    color: #3a1a2e; outline: none; resize: vertical;
    background: #fff9fb; line-height: 1.7; transition: border-color 0.2s;
  }
  .bulk-wrap textarea:focus { border-color: #e91e8c; background: #fff; }
  .bulk-wrap textarea::placeholder { color: #e0a0bc; }
  .bulk-hint { font-size: 12px; color: #d4a0b5; margin-top: 8px; margin-bottom: 16px; line-height: 1.6; }

  .btn {
    background: linear-gradient(135deg, #e91e8c, #ad1457);
    color: white; border: none; border-radius: 12px;
    padding: 13px 28px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s, transform 0.1s; white-space: nowrap;
  }
  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.97); }
  .btn-full { width: 100%; }

  .toggle-wrap {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: #b07090; cursor: pointer; user-select: none; margin-top: 12px;
  }
  .toggle-wrap input[type=checkbox] { accent-color: #e91e8c; width: 15px; height: 15px; cursor: pointer; }
  .hint { text-align: center; font-size: 12px; color: #d4a0b5; margin-top: 8px; }

  .result-section { display: none; margin-top: 20px; }
  .result-section.show { display: block; }
  .result-header {
    background: linear-gradient(135deg, #f06292, #e91e8c);
    color: white; padding: 14px 24px;
    border-radius: 14px 14px 0 0;
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
  }
  .result-count {
    font-size: 12px; background: rgba(255,255,255,0.25);
    border-radius: 20px; padding: 3px 12px; font-weight: 500;
  }
  .result-table-wrap {
    background: white; border-radius: 0 0 14px 14px;
    box-shadow: 0 4px 24px rgba(173,20,87,0.10); overflow: auto;
  }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  thead th {
    background: #fce4ec; color: #ad1457;
    font-size: 12px; font-weight: 700;
    padding: 11px 16px; text-align: left;
    border-bottom: 1px solid #f8bbd0; white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid #fce4ec; transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fff5f8; }
  tbody tr.unmatched { background: #fff8f8; }
  tbody td { padding: 11px 16px; font-size: 13px; color: #3a1a2e; vertical-align: middle; }
  .emp-num { font-family: monospace; color: #ad1457; font-weight: 600; font-size: 13px; }
  .badge-active {
    display: inline-block; background: #fce4ec; color: #c2185b;
    font-size: 11px; font-weight: 600; padding: 2px 10px;
    border-radius: 20px; border: 1px solid #f48fb1;
  }
  .badge-exit {
    display: inline-block; background: #f5f5f5; color: #9e9e9e;
    font-size: 11px; font-weight: 600; padding: 2px 10px;
    border-radius: 20px; border: 1px solid #e0e0e0;
  }
  .badge-error {
    display: inline-block; background: #ffebee; color: #c62828;
    font-size: 11px; font-weight: 600; padding: 2px 10px;
    border-radius: 20px; border: 1px solid #ef9a9a;
  }
  .memo-cell { color: #888; font-size: 12px; max-width: 200px; }
  .separator-row td {
    background: #fdf0f5; color: #c48b9f;
    font-size: 11px; font-weight: 600;
    padding: 6px 16px; text-align: center; letter-spacing: 1px;
  }
  .empty-msg { text-align: center; padding: 48px 20px; color: #c48b9f; font-size: 15px; }
  .empty-msg .icon { font-size: 36px; margin-bottom: 10px; }

  /* ── 이스터에그 트리거 하트 ── */
  #egg-trigger {
    position: fixed; bottom: 24px; right: 24px;
    font-size: 36px; cursor: pointer; z-index: 999;
    animation: heartbeat 1.4s ease-in-out infinite;
    filter: drop-shadow(0 2px 8px rgba(233,30,140,0.4));
    user-select: none;
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    14%      { transform: scale(1.22); }
    28%      { transform: scale(1); }
    42%      { transform: scale(1.15); }
    56%      { transform: scale(1); }
  }
  #egg-trigger:hover { filter: drop-shadow(0 4px 16px rgba(233,30,140,0.7)); }

  /* ── 이스터에그 팝업 ── */
  #egg-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(255,182,210,0.22);
    backdrop-filter: blur(3px);
    z-index: 1000;
    align-items: center; justify-content: center;
  }
  #egg-overlay.show { display: flex; }

  #egg-box {
    background: white;
    border-radius: 28px;
    padding: 36px 40px 32px;
    box-shadow: 0 16px 56px rgba(173,20,87,0.22);
    text-align: center;
    animation: popIn 0.38s cubic-bezier(.34,1.56,.64,1);
    max-width: 340px; width: 90%;
    position: relative;
  }
  @keyframes popIn {
    from { transform: scale(0.4) rotate(-8deg); opacity: 0; }
    to   { transform: scale(1)   rotate(0deg);  opacity: 1; }
  }
  #egg-close {
    position: absolute; top: 14px; right: 18px;
    font-size: 20px; cursor: pointer; color: #c48b9f;
    border: none; background: none; line-height: 1;
  }
  #egg-close:hover { color: #ad1457; }

  /* 무궁화 이미지 프레임 */
  .egg-img-wrap {
    width: 130px; height: 130px;
    margin: 0 auto 14px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid #f48fb1;
    box-shadow: 0 4px 18px rgba(233,30,140,0.22);
    position: relative;
  }
  .egg-img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    object-position: center top;
  }
  /* 무궁화 꽃잎 장식 */
  .egg-img-wrap::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.6);
  }

  .egg-title {
    font-size: 21px; font-weight: 800;
    color: #ad1457; margin-bottom: 10px;
    line-height: 1.4;
  }
  .egg-sub {
    font-size: 14px; color: #c48b9f;
    line-height: 1.75; margin-bottom: 20px;
  }
  .egg-sub strong { color: #e91e8c; }
  .egg-badge {
    display: inline-block;
    background: linear-gradient(135deg, #e91e8c, #ad1457);
    color: white; border-radius: 20px;
    padding: 9px 26px; font-size: 15px; font-weight: 800;
    letter-spacing: 0.5px;
    animation: badgePulse 1.8s ease-in-out infinite;
  }
  @keyframes badgePulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(233,30,140,0.4); }
    50%      { box-shadow: 0 0 0 10px rgba(233,30,140,0); }
  }

  /* 꽃가루 */
  .petal {
    position: fixed; top: -24px;
    animation: fall linear forwards;
    pointer-events: none; z-index: 1001;
  }
  @keyframes fall {
    to { transform: translateY(115vh) rotate(540deg); opacity: 0; }
  }

  /* ── 엑셀 업로드 탭 ── */
  .excel-upload-wrap { padding: 8px 0; }
  .upload-label {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 2.5px dashed #f48fb1; border-radius: 16px;
    padding: 40px 20px; cursor: pointer; transition: all 0.2s;
    background: #fff9fb; text-align: center;
  }
  .upload-label:hover { border-color: #e91e8c; background: #fff5f8; }
  .upload-label.dragover { border-color: #e91e8c; background: #fce4ec; transform: scale(1.01); }
  .upload-icon { font-size: 44px; margin-bottom: 12px; }
  .upload-text { font-size: 15px; font-weight: 600; color: #ad1457; margin-bottom: 4px; }
  .upload-sub { font-size: 12px; color: #d4a0b5; }
  .upload-done { font-size: 13px; color: #e91e8c; margin-top: 10px; font-weight: 600; text-align: center; }

  /* ── 정렬 헤더 ── */
  thead th.sortable {
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    white-space: nowrap;
  }
  thead th.sortable:hover { background: #f8bbd0; }
  .sort-icon { font-size: 10px; color: #e91e8c; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔍 사원번호 조회</h1>
    <p>이름·사번 검색 또는 명단을 한 번에 붙여넣어 소속을 확인하세요</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('bulk')">📋 일괄 조회</button>
    <button class="tab-btn" onclick="switchTab('search')">🔎 개별 검색</button>
    <button class="tab-btn" onclick="switchTab('excel')">📁 엑셀 업로드</button>
  </div>

  <div class="card">
    <div class="tab-panel active" id="panel-bulk">
      <div class="bulk-wrap">
        <textarea id="bulkInput" placeholder="이름과 사번을 붙여넣으세요.
빈 줄로 그룹을 구분할 수 있어요.

예시)
강민지	2639719 미가입
강석호	2639898 증액
김은혜	2542770 증액 > 소액초과자나 리스크대상"></textarea>
        <div class="bulk-hint">
          · 이름/사번 순서 상관없이 입력 가능 &nbsp;·&nbsp; 이름만 또는 사번만 입력해도 돼요<br>
          · 빈 줄은 구분선으로 표시
        </div>
        <button class="btn btn-full" onclick="doBulk()">조회하기</button>
      </div>
    </div>

    <div class="tab-panel" id="panel-search">
      <div class="input-wrap">
        <input type="text" id="searchInput" placeholder="이름 또는 사원번호 입력" autocomplete="off">
        <button class="btn" onclick="doSearch()">검색</button>
      </div>
      <label class="toggle-wrap">
        <input type="checkbox" id="showAll" onchange="doSearch()">
        퇴사자 포함하여 검색
      </label>
      <div class="hint">이름 · 사번 · 소속 · 폰번호로 검색 가능 · 엔터키로도 검색</div>
    </div>

    <div class="tab-panel" id="panel-excel">
      <div class="excel-upload-wrap">
        <label class="upload-label" id="uploadLabel" for="excelFile">
          <div class="upload-icon">📂</div>
          <div class="upload-text">엑셀 파일을 클릭하거나 드래그해서 올려주세요</div>
          <div class="upload-sub">비고란에 이름이 포함된 .xlsx 파일</div>
        </label>
        <input type="file" id="excelFile" accept=".xlsx" style="display:none" onchange="handleExcel(this)">
      </div>
    </div>
  </div>

  <div class="result-section" id="resultSection">
    <div class="result-header">
      <span id="resultTitle">결과</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="result-count" id="resultCount"></span>
        <button onclick="downloadExcel()" style="background:rgba(255,255,255,0.25);border:1px solid rgba(255,255,255,0.5);color:white;border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;cursor:pointer;">⬇️ 엑셀 저장</button>
      </div>
    </div>
    <div class="result-table-wrap">
      <div id="resultBody"></div>
    </div>
  </div>
</div>

<!-- 하트 트리거 -->
<div id="egg-trigger" onclick="openEgg()">💗</div>

<!-- 이스터에그 팝업 -->
<div id="egg-overlay" onclick="closeEggOutside(event)">
  <div id="egg-box">
    <button id="egg-close" onclick="closeEgg()">✕</button>

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active',
      (tab==='bulk' && i===0) || (tab==='search' && i===1) || (tab==='excel' && i===2)
    );
  });
  document.getElementById('panel-bulk').classList.toggle('active', tab==='bulk');
  document.getElementById('panel-search').classList.toggle('active', tab==='search');
  document.getElementById('panel-excel').classList.toggle('active', tab==='excel');
  document.getElementById('resultSection').classList.remove('show');
}

// ── 엑셀 업로드 처리 ──
function handleExcel(input) {
  const file = input.files[0];
  if (!file) return;
  const label = document.getElementById('uploadLabel');
  label.querySelector('.upload-text').textContent = '읽는 중...';

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type: 'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ''});

      const results = [];
      // 헤더 찾기 (비고 컬럼)
      let bigoCol = -1;
      let headerRow = 0;
      for (let i = 0; i < Math.min(5, rows.length); i++) {
        const idx = rows[i].findIndex(c => String(c).includes('비고'));
        if (idx >= 0) { bigoCol = idx; headerRow = i; break; }
      }

      if (bigoCol === -1) {
        label.querySelector('.upload-text').textContent = '❌ 비고 컬럼을 찾을 수 없어요';
        return;
      }

      // 이름 추출 패턴: 한글 2~4자 + 공백 + 날짜(숫자/숫자/)
      const namePattern = /^([가-힣]{2,4})\s+\d{4}\//;

      for (let i = headerRow + 1; i < rows.length; i++) {
        const bigo = String(rows[i][bigoCol] || '').trim();
        const match = bigo.match(namePattern);
        if (!match) continue;
        const 이름 = match[1];

        // DB 매칭
        const found = DB.filter(d => d.이름 === 이름);
        if (found.length === 1) {
          results.push({type:'data', 이름, 사번: found[0].사원번호, 소속: found[0].소속, 등록구분: found[0].등록구분, 메모: bigo.slice(이름.length).trim(), 매칭: true});
        } else if (found.length > 1) {
          found.forEach(f => results.push({type:'data', 이름: f.이름, 사번: f.사원번호, 소속: f.소속, 등록구분: f.등록구분, 메모: '⚠️ 동명이인', 매칭: true}));
        } else {
          results.push({type:'data', 이름, 사번: '-', 소속: '-', 등록구분: '-', 메모: bigo.slice(이름.length).trim(), 매칭: false});
        }
      }

      label.querySelector('.upload-text').textContent = '✅ ' + file.name;
      label.querySelector('.upload-sub').textContent = `${results.length}명 추출 완료`;
      showResult(results, file.name + ' 비고 추출 결과', true, results.length);
    } catch(err) {
      label.querySelector('.upload-text').textContent = '❌ 파일 읽기 실패: ' + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}

document.addEventListener('DOMContentLoaded', () => {
  const label = document.getElementById('uploadLabel');
  if (!label) return;
  label.addEventListener('dragover', e => { e.preventDefault(); label.classList.add('dragover'); });
  label.addEventListener('dragleave', () => label.classList.remove('dragover'));
  label.addEventListener('drop', e => {
    e.preventDefault(); label.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) { document.getElementById('excelFile').files; handleExcelFile(file); }
  });
});
function handleExcelFile(file) {
  const input = document.getElementById('excelFile');
  const dt = new DataTransfer();
  dt.items.add(file);
  input.files = dt.files;
  handleExcel(input);
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  const showAll = document.getElementById('showAll').checked;
  let list = DB;
  if (!showAll) list = list.filter(d => d.등록구분 !== '퇴사');
  if (q) {
    const qNum = q.replace(/\D/g,'');
    list = list.filter(d =>
      d.이름.includes(q) ||
      d.사원번호.includes(q) ||
      d.소속.includes(q) ||
      (qNum.length >= 9 && (d.폰번호||'').replace(/\D/g,'') === qNum) ||
      matchChosung(d.이름, q) ||
      matchChosung(d.소속, q)
    );
  }
  list.sort((a,b) => {
    const sc = a.소속.localeCompare(b.소속,'ko');
    return sc !== 0 ? sc : a.이름.localeCompare(b.이름,'ko');
  });
  showResult(list.map(d => ({type:'data', ...d, 사번: d.사원번호, 생년월일: d.생년월일||'', 폰번호: d.폰번호||'', 메모:'', 매칭:true})), q ? `"${q}" 검색 결과` : '전체 목록', false);
}

// 이름인지 사번인지 판별 (숫자 7자리 이상이면 사번)
function isSabun(str) { return /^\d{6,8}$/.test(str); } // 사번은 6~8자리, 폰번호(10~11자리)는 제외

function parseLine(trimmed) {
  const parts = trimmed.split(/\s+/);
  if (parts.length === 0) return null;

  let 이름 = '', 사번 = '', memo = '';

  if (parts.length === 1) {
    // 이름만 or 사번만
    if (isSabun(parts[0])) { 사번 = parts[0]; }
    else { 이름 = parts[0]; }
  } else {
    // 첫 토큰이 사번이면 → 사번 이름 순서
    if (isSabun(parts[0])) {
      사번 = parts[0];
      이름 = parts[1];
      memo = parts.slice(2).join(' ');
    } else {
      // 이름 사번 순서 (기존)
      이름 = parts[0];
      사번 = parts[1];
      // 사번이 사번처럼 안 생겼으면 두 번째도 이름일 수 있으나,
      // 일단 두 번째가 숫자면 사번, 아니면 사번 없이 이름만 처리
      if (!isSabun(사번)) { 이름 = trimmed; 사번 = ''; memo = ''; }
      else { memo = parts.slice(2).join(' '); }
    }
  }
  return { 이름, 사번, memo };
}

function doBulk() {
  const raw = document.getElementById('bulkInput').value;
  const lines = raw.split('\n');
  const rows = [];

  lines.forEach(line => {
    const trimmed = line.trim();
    if (!trimmed) { rows.push({type:'sep'}); return; }

    const parsed = parseLine(trimmed);
    if (!parsed) return;
    const { 이름, 사번, memo } = parsed;

    // 사번으로 먼저 매칭
    let info = 사번 ? DB_MAP[사번] : null;

    // 사번 없거나 미매칭 → 이름으로 DB 검색
    if (!info && 이름) {
      const found = DB.filter(d => d.이름 === 이름);
      if (found.length === 1) info = found[0];
      else if (found.length > 1) {
        // 동명이인: 여러 행으로
        found.forEach(f => {
          rows.push({type:'data', 이름: f.이름, 사번: f.사원번호, 소속: f.소속, 등록구분: f.등록구분, 생년월일: f.생년월일||'', 폰번호: f.폰번호||'', 메모: memo + (found.length>1?' ⚠️동명이인':''), 매칭: true});
        });
        return;
      }
    }

    if (info) {
      rows.push({type:'data', 이름: 이름||info.이름, 사번: 사번||info.사원번호, 소속: info.소속, 등록구분: info.등록구분, 생년월일: info.생년월일||'', 폰번호: info.폰번호||'', 메모: memo, 매칭: true});
    } else {
      rows.push({type:'data', 이름: 이름||(사번||'?'), 사번: 사번||'-', 소속:'-', 등록구분:'-', 생년월일:'', 메모: memo, 매칭: false});
    }
  });

  const total = rows.filter(r => r.type==='data').length;
  showResult(rows, '일괄 조회 결과', true, total);
}

function showResult(rows, title, isBulk, total) {
  window._lastRows = rows;
  window._sortKey = '';
  window._sortAsc = true;
  const section = document.getElementById('resultSection');
  const body = document.getElementById('resultBody');
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultCount').textContent = (total ?? rows.filter(r=>r.type==='data').length) + '명';
  section.classList.add('show');
  if (!rows.length || (isBulk && rows.every(r=>r.type==='sep'))) {
    body.innerHTML = `<div class="empty-msg"><div class="icon">🌸</div>결과가 없어요</div>`;
    return;
  }
  // 정렬 상태 저장
  window._sortKey = window._sortKey || '';
  window._sortAsc = window._sortAsc !== undefined ? window._sortAsc : true;

  let html = makeHeader();
  html += '<tbody>';
  rows.forEach(r => {
    if (r.type === 'sep') {
      html += `<tr class="separator-row"><td colspan="4">· · ·</td></tr>`;
      return;
    }
    const badge = r.매칭
      ? (r.등록구분 === '재직' ? `<span class="badge-active">재직</span>` : `<span class="badge-exit">${r.등록구분}</span>`)
      : `<span class="badge-error">미매칭</span>`;
    html += `<tr class="${r.매칭?'':'unmatched'}">
      <td>${badge}</td>
      <td>${r.이름}</td>
      <td class="emp-num">${r.사번}</td>
      <td>${r.소속}</td>
      <td>${fmtBirth(r.생년월일)}</td>
      <td>${fmtPhone(r.폰번호)}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  body.innerHTML = html;
  updateSortIcons();
}

function renderTable(rows) {
  const body = document.getElementById('resultBody');
  // 헤더 재사용
  let html = makeHeader();
  html += '<tbody>';
  rows.forEach(r => {
    if (r.type === 'sep') {
      html += `<tr class="separator-row"><td colspan="4">· · ·</td></tr>`;
      return;
    }
    const badge = r.매칭
      ? (r.등록구분 === '재직' ? `<span class="badge-active">재직</span>` : `<span class="badge-exit">${r.등록구분}</span>`)
      : `<span class="badge-error">미매칭</span>`;
    html += `<tr class="${r.매칭?'':'unmatched'}">
      <td>${r.이름}</td>
      <td class="emp-num">${r.사번}</td>
      <td>${r.소속}</td>
      <td>${(r.생년월일 && r.생년월일 !== '//') ? r.생년월일 : ''}</td>
      <td>${badge}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  body.innerHTML = html;
  updateSortIcons();
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

function fmtBirth(v) {
  if (!v || v === '//') return '';
  // 2003/06/09 → 2003-06-09
  return v.replace(/\//g, '-');
}
function fmtPhone(v) {
  if (!v) return '';
  const d = v.replace(/\D/g, '');
  if (d.length === 11) return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7);
  if (d.length === 10) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6);
  return v;
}

function makeHeader() {
  return `<table><thead><tr>
    <th>상태</th>
    <th class="sortable" onclick="sortTable('이름')">이름 <span class="sort-icon" id="sort-이름"></span></th>
    <th class="sortable" onclick="sortTable('사번')">사원번호 <span class="sort-icon" id="sort-사번"></span></th>
    <th class="sortable" onclick="sortTable('소속')">소속 <span class="sort-icon" id="sort-소속"></span></th>
    <th class="sortable" onclick="sortTable('생년월일')">생년월일 <span class="sort-icon" id="sort-생년월일"></span></th>
    <th>폰번호</th>
  </tr></thead>`;
}

function downloadExcel() {
  const rows = window._lastRows || [];
  const dataRows = rows.filter(r => r.type === 'data');
  if (!dataRows.length) return;

  const title = document.getElementById('resultTitle').textContent;
  const ws_data = [['상태','이름','사원번호','소속','생년월일','폰번호','메모']];
  dataRows.forEach(r => {
    ws_data.push([
      r.등록구분 || (r.매칭 ? '' : '미매칭'),
      r.이름 || '',
      r.사번 || '',
      r.소속 || '',
      (r.생년월일 && r.생년월일 !== '//') ? r.생년월일.replace(/\//g,'-') : '',
      r.폰번호 ? r.폰번호.replace(/\D/g,'').replace(/(\d{3})(\d{3,4})(\d{4})/, '$1-$2-$3') : '',
      r.메모 || ''
    ]);
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(ws_data);

  // 컬럼 너비 설정
  ws['!cols'] = [
    {wch:8},{wch:10},{wch:12},{wch:22},{wch:14},{wch:16},{wch:30}
  ];

  XLSX.utils.book_append_sheet(wb, ws, '조회결과');
  const now = new Date();
  const date = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  XLSX.writeFile(wb, `사원조회_${date}.xlsx`);
}


// ── 초성 검색 ──
const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChosung(str) {
  return str.split('').map(ch => {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code < 0 || code > 11171) return ch;
    return CHOSUNG[Math.floor(code / 588)];
  }).join('');
}
function matchChosung(target, query) {
  // query가 전부 초성인지 확인
  const isAllChosung = [...query].every(c => CHOSUNG.includes(c));
  if (!isAllChosung) return false;
  return getChosung(target).includes(query);
}

// ── 컬럼 정렬 ──
window._lastRows = [];
window._sortKey = '';
window._sortAsc = true;

function sortTable(key) {
  if (window._sortKey === key) {
    window._sortAsc = !window._sortAsc;
  } else {
    window._sortKey = key;
    window._sortAsc = true;
  }
  const rows = window._lastRows;
  const asc = window._sortAsc;
  const dataRows = rows.filter(r => r.type === 'data');
  const sepRows = rows.filter(r => r.type === 'sep');

  // sep 있으면 그룹 유지하면서 각 그룹 내 정렬
  if (sepRows.length > 0) {
    // 그룹 분리
    const groups = [];
    let cur = [];
    rows.forEach(r => {
      if (r.type === 'sep') { groups.push(cur); cur = []; }
      else cur.push(r);
    });
    groups.push(cur);
    const sorted = groups.map(g => g.sort((a,b) => compare(a,b,key,asc)));
    const merged = [];
    sorted.forEach((g,i) => { merged.push(...g); if (i < sorted.length-1) merged.push({type:'sep'}); });
    window._lastRows = merged;
    renderTable(merged);
  } else {
    dataRows.sort((a,b) => compare(a,b,key,asc));
    window._lastRows = dataRows;
    renderTable(dataRows);
  }
  updateSortIcons();
}

function compare(a, b, key, asc) {
  const va = (a[key] || '').toString();
  const vb = (b[key] || '').toString();
  const result = va.localeCompare(vb, 'ko', {numeric: key==='사번'});
  return asc ? result : -result;
}

function updateSortIcons() {
  ['이름','사번','소속'].forEach(k => {
    const el = document.getElementById('sort-' + k);
    if (!el) return;
    if (window._sortKey === k) {
      el.textContent = window._sortAsc ? ' ▲' : ' ▼';
    } else {
      el.textContent = ' ⇅';
    }
  });
}

function openEgg() {
  document.getElementById('egg-overlay').classList.add('show');
  spawnPetals();
}
function closeEgg() {
  document.getElementById('egg-overlay').classList.remove('show');
}
function closeEggOutside(e) {
  if (e.target === document.getElementById('egg-overlay')) closeEgg();
}

const PETALS = ['🌸','🌷','💗','✨','🎀','💕','🌺','💖','⭐','🎉'];
function spawnPetals() {
  for (let i = 0; i < 35; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'petal';
      el.textContent = PETALS[Math.floor(Math.random()*PETALS.length)];
      el.style.left = Math.random()*100 + 'vw';
      el.style.fontSize = (13 + Math.random()*18) + 'px';
      const dur = 2.0 + Math.random()*2.2;
      el.style.animation = `fall ${dur}s linear forwards`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), dur*1000);
    }, i * 70);
  }
}
